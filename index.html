<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Menú</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #000; 
            font-family: 'Raleway', sans-serif; 
            color: white; 
            overflow: hidden; 
        }

        /* --- CONTENEDOR CON SCROLL SNAP (LA MAGIA) --- */
        #menu-container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory; /* Obliga a detenerse en cada foto */
            scroll-behavior: smooth;
            /* Ocultar barra de scroll para mayor elegancia */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        #menu-container::-webkit-scrollbar { display: none; }

        /* --- CADA PLATO (SECCIÓN) --- */
        .menu-item {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start; /* Punto de enganche */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* La imagen de fondo */
        .menu-bg {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Asegura que la foto cubra todo sin deformarse */
            object-position: center;
        }

        /* Flecha indicadora animada */
        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            animation: bounce 2s infinite;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));
        }

        /* Loader */
        .loader {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background: #121212;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) translateY(0);}
            40% {transform: translateX(-50%) translateY(-10px);}
            60% {transform: translateX(-50%) translateY(-5px);}
        }
    </style>
</head>
<body>

    <div id="menu-container">
        <div class="loader" id="loader">
            <h2 style="font-family: 'Playfair Display'; color: #3ecf8e;">Cargando Menú...</h2>
        </div>
    </div>

<script>
    lucide.createIcons();
    
    // CONEXIÓN SUPABASE
    const SUPABASE_URL = 'https://uqbisplipwdkiyvxvurn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxYmlzcGxpcHdka2l5dnh2dXJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3MjE1NDYsImV4cCI6MjA4NTI5NzU0Nn0.UZl6unPW3ZWuVe33s5iJyJxrQpyLTp8iQ6k52Ux2_CU'; 
    const clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const container = document.getElementById('menu-container');

    async function cargarMenu() {
        // Obtenemos las imágenes ordenadas por la más reciente
        const { data, error } = await clienteSupabase
            .from('imagenes_publicas')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            console.error(error);
            return;
        }

        const loader = document.getElementById('loader');
        if(loader) loader.remove();

        if (data.length === 0) {
            container.innerHTML = `<div class="menu-item"><h3>Pronto publicaremos nuestro menú.</h3></div>`;
            return;
        }

        data.forEach((img, index) => {
            const div = document.createElement('div');
            div.className = 'menu-item';
            
            // Solo mostramos la flecha si NO es la última imagen
            const arrowHtml = index < data.length - 1 
                ? `<div class="scroll-hint"><i data-lucide="chevron-down" color="white" size="40"></i></div>` 
                : `<div class="scroll-hint"><span style="font-size:12px; opacity:0.7;">Fin del menú</span></div>`;

            div.innerHTML = `
                <img src="${img.url_publica}" class="menu-bg" loading="lazy" alt="Plato">
                ${arrowHtml}
            `;
            container.appendChild(div);
        });
        
        lucide.createIcons();
    }

    cargarMenu();
</script>
</body>
</html>
